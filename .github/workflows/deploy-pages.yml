# 网页版自动发布到 GitHub Pages：推送到 main 或 stage1-and-story-art 后自动构建并上线
# 第一次使用前：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」
name: 发布网页版

on:
  push:
    branches: [main, stage1-and-story-art]
  workflow_dispatch: # 也可以在 Actions 页面手动点「Run workflow」

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次发布，新的推送会排在后面
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 网页版没有广告（不设 VITE_ADS）
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
